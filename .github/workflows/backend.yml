name: Backend .NET 10

on:
  pull_request:
    paths: ['Control-Fertilizantes-App/Control-Fertilizantes-Backend/**', 'scripts/Probar-Backend.ps1', 'global.json', 'NuGet.Config', 'database/global.json', '.github/workflows/backend.yml', '.gitignore']
  push:
    branches: [main]
    paths: ['Control-Fertilizantes-App/Control-Fertilizantes-Backend/**', 'scripts/Probar-Backend.ps1', 'global.json', 'NuGet.Config', 'database/global.json', '.github/workflows/backend.yml', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-y-verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Compilar y probar API sin base de datos
        run: ./scripts/Probar-Backend.ps1
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-dotnet10-${{ github.sha }}
          path: artifacts/backend/
          if-no-files-found: ignore
          retention-days: 14
